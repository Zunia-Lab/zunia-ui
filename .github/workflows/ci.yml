name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contrast
      - run: pnpm check:parity
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm gen:flutter

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze tokens-flutter
        working-directory: packages/tokens-flutter
        run: flutter pub get && dart analyze
      - name: Analyze ui-flutter
        working-directory: packages/ui-flutter
        run: flutter pub get && flutter analyze
