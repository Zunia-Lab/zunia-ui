name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contrast
      - run: pnpm check:parity
      - run: pnpm typecheck
      - run: pnpm build
      # gen:flutter rewrites packages/tokens-flutter from the TypeScript tokens. Running
      # it and discarding the result only proved the generator does not crash; the diff
      # is what catches a token edit that was never regenerated and committed, which is
      # how web and Flutter drift apart.
      - run: pnpm gen:flutter
      - name: Generated Flutter tokens are up to date
        run: git diff --exit-code -- packages/tokens-flutter

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze tokens-flutter
        working-directory: packages/tokens-flutter
        run: flutter pub get && dart analyze
      - name: Analyze ui-flutter
        working-directory: packages/ui-flutter
        run: flutter pub get && flutter analyze
