name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance. Without this the publish succeeds but produces no
  # attestation, so consumers cannot verify where the tarball was built.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify before publishing
        run: |
          pnpm check:contrast
          pnpm check:parity
          pnpm typecheck
          pnpm test
          pnpm build

      # Opens or updates a "Version Packages" PR when changesets are pending, and publishes
      # once that PR is merged. Two steps, one action.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Consumers are separate repositories (ADR-0005), so a release has to reach out to
      # them. Each consumer runs a workflow that bumps the dependency and opens a PR, which
      # keeps a kernel or design-system bump reviewable instead of invisible.
      - name: Notify consumer repositories
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: |
          for repo in zunia-website zunia-dashboard zunia-extension; do
            gh api "repos/Zunia-Lab/$repo/dispatches" \
              -f event_type=zunia-ui-released \
              -F "client_payload[packages]=${{ steps.changesets.outputs.publishedPackages }}" \
              || echo "dispatch to $repo failed, open the bump PR by hand"
          done
